<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IPSA — Frontera Eficiente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <div class="header-left">
      <h1 class="header-title">IPSA · Frontera Eficiente</h1>
      <p class="header-sub">Portafolio de máximo Sharpe · actualización semanal</p>
    </div>
    <div class="header-date" id="dateContainer"></div>
  </header>

  <div class="ticker-wrap" aria-label="Cinta de cotizaciones">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <main class="container">
    <section class="info-section" id="portfolioInfo"></section>
    <section class="chart-section">
      <canvas id="chartFrontier"></canvas>
      <div class="chart-legend">
        <span class="dot dot-cloud"></span> Portafolios simulados
        <span class="dot dot-frontier"></span> Frontera eficiente
        <span class="dot dot-optimal"></span> Máximo Sharpe
        <span class="dot dot-selected"></span> Top 5 acciones
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
