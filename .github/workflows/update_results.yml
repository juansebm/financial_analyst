name: Update Portfolio (weekly)

on:
  schedule:
    - cron: '0 14 * * 1'  # Lunes 14:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run portfolio optimizer
        run: python financial_analyst.py

      - name: Copy results to docs
        run: cp results.json docs/results.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json docs/results.json
          git commit -m "📈 portafolio IPSA [$(date -u +%Y-%m-%d)]" || exit 0
          git push
